services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: garagehub
      POSTGRES_PASSWORD: garagehub
      POSTGRES_DB: garagehub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garagehub"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://garagehub:garagehub@db:5432/garagehub
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
